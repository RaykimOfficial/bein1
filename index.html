<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Stream Test</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 30px;
      font-size: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="out">Test başlıyor...</div>

<script>
const out = document.getElementById("out");

async function test() {
  try {
    out.textContent = "Worker yayınına bağlanılıyor...";

    const response = await fetch("/bein/224163");

    out.textContent =
      "HTTP: " + response.status +
      "\nContent-Type: " + response.headers.get("content-type") +
      "\n\nStream okunuyor...";

    if (!response.body) {
      out.textContent += "\n\nHATA: Response body yok.";
      return;
    }

    const reader = response.body.getReader();

    const { value, done } = await reader.read();

    out.textContent +=
      "\n\nİLK VERİ GELDİ!" +
      "\nByte miktarı: " + (value ? value.length : 0) +
      "\nStream bitti mi: " + done;

    reader.cancel();

  } catch (err) {
    out.textContent =
      "HATA\n\n" +
      err.name +
      "\n" +
      err.message;
  }
}

test();
</script>

</body>
</html>
